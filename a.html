<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de Produtos</title>
    <style>
        :root {
            --primary-blue: #2a4095;
            --light-gray: #f4f4f4;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
        }

        /* Container Principal */
        .carousel-wrapper {
            position: relative;
            width: 90%;
            max-width: 1200px;
            display: flex;
            align-items: center;
        }

        /* Área de Scroll */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            gap: 20px;
            padding: 20px 0;
            scrollbar-width: none; /* Esconde scroll no Firefox */
        }

        .carousel-container::-webkit-scrollbar {
            display: none; /* Esconde scroll no Chrome/Safari */
        }

        /* Card do Produto */
        .product-card {
            flex: 0 0 calc(25% - 15px); /* 4 itens por vez */
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 200px;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-title {
            color: var(--primary-blue);
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            line-height: 1.4;
            margin-bottom: 10px;
            display: block;
            height: 40px;
        }

        /* Linha decorativa abaixo do título */
        .divider {
            width: 40px;
            height: 2px;
            background-color: var(--primary-blue);
        }

        /* Setas de Navegação */
        .nav-btn {
            background: none;
            border: none;
            font-size: 30px;
            color: #666;
            cursor: pointer;
            padding: 10px;
            transition: color 0.3s;
            position: absolute;
            z-index: 10;
        }

        .nav-btn:hover {
            color: var(--primary-blue);
        }

        .prev { left: -50px; }
        .next { right: -50px; }

        /* Responsividade */
        @media (max-width: 900px) {
            .product-card { flex: 0 0 calc(50% - 10px); }
            .prev { left: -20px; }
            .next { right: -20px; }
        }

        @media (max-width: 500px) {
            .product-card { flex: 0 0 100%; }
        }
    </style>
</head>
<body>

<div class="carousel-wrapper">
    <button class="nav-btn prev" onclick="scrollCarousel(-1)">&#10094;</button>
    
    <div class="carousel-container" id="carousel">
        <div class="product-card">
            <img src="https://via.placeholder.com/200x200?text=Marcador+Azul" alt="Produto" class="product-image">
            <a href="#" class="product-title">Marcador Permanente Azul Pilot 400</a>
            <div class="divider"></div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200x200?text=Marcador+Preto" alt="Produto" class="product-image">
            <a href="#" class="product-title">Marcador Permanente Preto Pilot 400</a>
            <div class="divider"></div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200x200?text=Poster+Pen+10/30" alt="Produto" class="product-image">
            <a href="#" class="product-title">Caneta Poster Pen Metiq 10/30mm</a>
            <div class="divider"></div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200x200?text=Poster+Pen+9ml" alt="Produto" class="product-image">
            <a href="#" class="product-title">Caneta Poster Pen Metiq 2/5mm 9ml</a>
            <div class="divider"></div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200x200?text=Extra+Item" alt="Produto" class="product-image">
            <a href="#" class="product-title">Outro Produto Exemplo para Scroll</a>
            <div class="divider"></div>
        </div>
    </div>

    <button class="nav-btn next" onclick="scrollCarousel(1)">&#10095;</button>
</div>

<script>
    function scrollCarousel(direction) {
        const carousel = document.getElementById('carousel');
        const scrollAmount = carousel.offsetWidth; // Rola a largura visível
        carousel.scrollBy({
            left: direction * scrollAmount,
            behavior: 'smooth'
        });
    }
</script>

</body>
